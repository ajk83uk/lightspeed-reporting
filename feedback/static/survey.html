<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141414">
<title>Tap &amp; Tandoor Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: Tap & Tandoor yellow (#ffd503, sampled from the logo) on near-black; light neutral body, one card per question, sticky bottom bar for thumbs. */
:root {
  --head: #141414;
  --paper: #f5f4f0;
  --card: #ffffff;
  --ink: #17150f;
  --muted: #5f5b52;
  --line: #dedbd2;
  --brand: #ffd503;
  --brand-ink: #17150f;
  --brand-edge: #17150f;
  --focus: #17150f;
  --star: #ffd503;
  --star-edge: #b38f00;
  --star-off: #bdb8aa;
  --sorry: #a8231b;
  --sorry-bg: #fdeceb;
  --good: #1b6e45;
  --good-bg: #e6f4ec;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101010; --card: #1d1c19; --ink: #f4f1e8; --muted: #b0aa9b; --line: #34312a;
    --brand-edge: #ffd503; --focus: #ffd503; --star-edge: #ffd503; --star-off: #5a5648;
    --sorry: #ff9a92; --sorry-bg: #3a1c1f; --good: #7fd4a4; --good-bg: #17301f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101010; --card: #1d1c19; --ink: #f4f1e8; --muted: #b0aa9b; --line: #34312a;
  --brand-edge: #ffd503; --focus: #ffd503; --star-edge: #ffd503; --star-off: #5a5648;
  --sorry: #ff9a92; --sorry-bg: #3a1c1f; --good: #7fd4a4; --good-bg: #17301f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.45;
  min-height: 100vh; display: flex; flex-direction: column;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.top :focus-visible, .actions :focus-visible { outline-color: #ffd503; }

/* Header and progress */
.top { position: sticky; top: 0; z-index: 5; background: var(--head); color: #f4f1e8; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid #2a2823; }
.top-row { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { height: 34px; width: auto; display: block; }
.site-pill { font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 99px; border: 1.5px solid #ffd503; color: #ffd503; white-space: nowrap; }
.progress { max-width: 560px; margin: 10px auto 0; }
.progress[hidden] { display: none; }
.bar { height: 8px; background: #3b3934; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: #ffd503; border-radius: 99px; transition: width .35s ease; }
.progress-label { margin-top: 6px; font-size: 13px; color: #bdb8aa; display: flex; justify-content: space-between; }

/* Layout */
main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 16px 128px; }
.panel { display: none; }
.panel.on { display: block; animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.kicker { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.q { font-size: 28px; margin-bottom: 6px; }
.help { color: var(--muted); margin: 0 0 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; }

/* Stars */
.stars { display: flex; justify-content: space-between; gap: 4px; max-width: 360px; margin: 0 auto; }
.star {
  flex: 1; min-width: 0; aspect-ratio: 1; max-width: 68px; border: 0; background: transparent; padding: 4px;
  cursor: pointer; border-radius: 12px; -webkit-tap-highlight-color: transparent;
}
.star svg { width: 100%; height: 100%; display: block; }
.star path { fill: transparent; stroke: var(--star-off); stroke-width: 1.6; stroke-linejoin: round; transition: fill .12s, stroke .12s; }
.star.on path { fill: var(--star); stroke: var(--star-edge); }
.star.pop svg { animation: pop .28s ease; }
@keyframes pop { 0% { transform: scale(.82); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (hover: hover) { .stars:hover .star path { stroke: var(--star-edge); } .star:hover { background: rgba(255,213,3,.16); } }
.word { text-align: center; min-height: 28px; margin-top: 10px; font-weight: 600; font-size: 18px; }
.word.low { color: var(--sorry); }
.word.high { color: var(--good); }
.scale { display: flex; justify-content: space-between; max-width: 360px; margin: 2px auto 0; font-size: 12px; color: var(--muted); padding: 0 4px; }

/* Follow-up when 3 stars or fewer */
.followup { margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--sorry-bg); border: 1px solid color-mix(in srgb, var(--sorry) 35%, transparent); }
.followup.enter { animation: rise .3s ease both; }
.followup h3 { font-size: 19px; color: var(--sorry); margin-bottom: 4px; }
.followup p { margin: 0 0 12px; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 9px 14px; font-size: 15px; cursor: pointer; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand-edge); color: var(--brand-ink); font-weight: 600; }
.chip.health { border-color: var(--sorry); color: var(--sorry); }
.chip.health[aria-pressed="true"] { background: var(--sorry); color: #fff; }
textarea { width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; }
textarea:focus { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); border-color: var(--brand-edge); }
label.field { display: block; font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.alert { margin-bottom: 12px; padding: 12px 14px; border-radius: 12px; background: var(--sorry); color: #fff; font-size: 15px; font-weight: 500; }
.praise { margin-top: 14px; }
.link { background: none; border: 0; padding: 10px 2px; color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }

/* Dishes */
.dishes { margin-top: 26px; }
.dishes h3 { font-size: 21px; margin-bottom: 4px; }
.dish { margin-top: 12px; }
.dish-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.dish-name { font-weight: 600; }
.dish-qty { font-size: 13px; color: var(--muted); white-space: nowrap; }
.dish .stars { max-width: 300px; margin: 0; }
.dish .star { max-width: 52px; }
.dish .followup { margin-top: 12px; padding: 12px; }
.dish .followup h3 { font-size: 16px; }
.dish textarea { min-height: 64px; }

/* Buttons and bar */
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.actions[hidden] { display: none; }
.actions-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.btn { border: 0; border-radius: 14px; min-height: 54px; padding: 0 22px; font-weight: 600; font-size: 17px; cursor: pointer; }
.btn.primary { flex: 1; background: var(--brand); color: var(--brand-ink); }
.btn.primary:disabled { opacity: .38; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.block { display: flex; width: 100%; align-items: center; justify-content: center; text-decoration: none; }
.skip { display: block; margin: 14px auto 0; }

/* Screens */
.hero h1 { font-size: 34px; margin-bottom: 10px; }
.hero p { margin: 0 0 12px; }
.facts { display: grid; gap: 10px; margin: 20px 0 8px; padding: 0; list-style: none; }
.facts li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--star); box-shadow: 0 0 0 1.5px var(--star-edge); margin-top: 8px; }
.end { text-align: center; padding-top: 24px; }
.end h1 { font-size: 32px; margin-bottom: 10px; }
.end p { max-width: 420px; margin: 0 auto 14px; }
.badge { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); }
.badge.soft { background: var(--card); border: 1px solid var(--line); color: var(--ink); }
.badge svg { width: 36px; height: 36px; }
.demo { position: fixed; left: 8px; top: 50%; z-index: 9; font-size: 11px; background: var(--ink); color: var(--paper); padding: 3px 8px; border-radius: 99px; opacity: .8; }
.demo-nav { max-width: 560px; margin: 24px auto 0; font-size: 13px; color: var(--muted); text-align: center; }
.demo-nav a { color: var(--ink); margin: 0 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
/* ------------------------------------------------------------------
   PRODUCTION: the link is https://feedback.tapandtandoor.co.uk/r/<token>
   GET  /api/survey/<token>         -> { status:'open'|'completed'|'expired', site, guestName, visitDate, dishes[], googleReviewUrl, sitePhone }
   POST /api/survey/<token>/submit  -> { ok:true }  (server marks the token completed in the same transaction, so it cannot be reused)
   Preview mode (this file opened on its own) uses the sample data below.
------------------------------------------------------------------- */
const DEMO = false;
const DEMO_DATA = {
  status: 'open',
  site: 'Solihull',
  guestName: 'Priya',
  visitDate: 'Thursday 26 November',
  googleReviewUrl: '#',
  sitePhone: '',
  dishes: [
    { name: 'Butter Chicken', qty: 2 }, { name: 'Garlic Naan', qty: 3 }, { name: 'Lamb Curry', qty: 1 },

    { name: 'Poppadoms', qty: 1 }, { name: 'Gulab Jamun', qty: 2 }
  ]
};

const TAGS = {
  food: ['Cold', 'Too salty', 'Too spicy', 'Not spicy enough', 'Bland', 'Small portion', 'Not as described', 'Took too long'],
  drink: ['Flat or warm', 'Weak', 'Wrong drink', 'Took too long', 'Limited choice', 'Poor value'],
  service: ['Slow to greet us', 'Slow to serve', 'Not attentive', 'Unfriendly', 'Order mistake', 'Bill problem'],
  atmosphere: ['Too loud', 'Too quiet', 'Too hot or cold', 'Untidy or dirty', 'Uncomfortable seating', 'Too busy'],
  dish: ['Cold', 'Too salty', 'Too spicy', 'Bland', 'Small portion', 'Not as described']
};
const STEPS = [
  { key: 'food', name: 'Food', q: 'How was your food?', help: 'Think about the whole meal.', sorry: 'What went wrong with the food?' },
  { key: 'drink', name: 'Drink', q: 'How were your drinks?', help: 'Beers, cocktails, soft drinks, anything you had.', skip: "We didn't have drinks", sorry: 'What went wrong with the drinks?' },
  { key: 'service', name: 'Service', q: 'How was the service?', help: 'How we welcomed, looked after and served you.', sorry: 'What went wrong with the service?' },
  { key: 'atmosphere', name: 'Atmosphere', q: 'How was the atmosphere?', help: 'Music, noise, temperature, how the place felt.', sorry: 'What went wrong with the atmosphere?' },
  { key: 'other', name: 'Anything else', q: 'Anything else to tell us?', help: 'Optional. A word about something we got right, or something you want us to know.' }
];
const WORDS = ['', 'Poor', 'Fair', 'OK', 'Good', 'Excellent'];
const STAR_PATH = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const blank = () => ({ rating: null, skipped: false, tags: [], text: '', comment: false });

let data = null;
let step = -1;
let showAll = false;
let sending = false;
let enterKey = null;
const A = {}; STEPS.forEach((s) => { if (s.key !== 'other') A[s.key] = blank(); });
const D = {}; let other = { text: '', contactOk: false };

/* Draft kept only on this device so a refresh does not lose answers. Cleared on submit. */
const draftKey = 'tt-feedback-draft';
function saveDraft() { try { sessionStorage.setItem(draftKey, JSON.stringify({ step, A, D, other })); } catch (e) {} }
function loadDraft() {
  try {
    const d = JSON.parse(sessionStorage.getItem(draftKey) || 'null');
    if (!d) return;
    Object.assign(A, d.A || {}); Object.assign(D, d.D || {}); other = d.other || other; step = typeof d.step === 'number' ? d.step : -1;
  } catch (e) {}
}
function clearDraft() { try { sessionStorage.removeItem(draftKey); } catch (e) {} }

function starSvg() { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '"/></svg>'; }

function stars(id, value, label) {
  let h = '<div class="stars" role="radiogroup" aria-label="' + esc(label) + '" data-stars="' + esc(id) + '">';
  for (let i = 1; i <= 5; i++) {
    h += '<button type="button" class="star' + (value && i <= value ? ' on' : '') + '" role="radio" aria-checked="' + (value === i) + '" aria-label="' + i + ' star' + (i > 1 ? 's' : '') + ', ' + WORDS[i] + '" data-v="' + i + '" id="s-' + esc(id) + '-' + i + '">' + starSvg() + '</button>';
  }
  return h + '</div>';
}
function wordLine(v) {
  if (!v) return '<div class="word" aria-live="polite">Tap a star</div>';
  const cls = v <= 3 ? 'low' : v >= 4 ? 'high' : '';
  return '<div class="word ' + cls + '" aria-live="polite">' + WORDS[v] + '</div>';
}
function chips(group, selected, prefix, withHealth) {
  let h = '<div class="chips" data-chips="' + esc(prefix) + '">';
  TAGS[group].forEach((t) => { h += '<button type="button" class="chip" aria-pressed="' + selected.includes(t) + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>'; });
  if (withHealth) h += '<button type="button" class="chip health" aria-pressed="' + selected.includes('health') + '" data-tag="health">I felt unwell or had an allergy problem</button>';
  return h + '</div>';
}
function healthAlert() {
  const tel = data.sitePhone ? ' on ' + esc(data.sitePhone) : '';
  return '<div class="alert" role="alert">That is serious and we want to look into it today. Please ring Tap &amp; Tandoor ' + esc(data.site) + tel + ' as well, so a manager can speak to you.</div>';
}

function followup(key, a, sorry, group, isDish) {
  const enter = enterKey === key ? ' enter' : '';
  let h = '<div class="followup' + enter + '" data-fu="' + esc(key) + '">';
  if (!isDish && a.tags.includes('health')) h += healthAlert();
  h += '<h3>' + (isDish ? 'What was wrong?' : 'Sorry we missed the mark') + '</h3>';
  h += '<p>' + esc(sorry) + ' Tap anything that applies.</p>';
  h += chips(group, a.tags, key, key === 'food');
  h += '<label class="field" for="t-' + esc(key) + '">What could we do better?</label>';
  h += '<textarea id="t-' + esc(key) + '" data-text="' + esc(key) + '" placeholder="Tell us in your own words (optional)" maxlength="1000">' + esc(a.text) + '</textarea>';
  return h + '</div>';
}
function praise(key, a) {
  if (!a.comment) return '<div class="praise"><button type="button" class="link" data-comment="' + esc(key) + '">Add a comment (optional)</button></div>';
  return '<div class="praise"><label class="field" for="t-' + esc(key) + '">What was good?</label><textarea id="t-' + esc(key) + '" data-text="' + esc(key) + '" placeholder="Optional" maxlength="1000">' + esc(a.text) + '</textarea></div>';
}

function dishBlock() {
  const list = data.dishes || [];
  if (!list.length) return '';
  const visible = showAll ? list : list.slice(0, 5);
  let h = '<div class="dishes"><h3>Rate the dishes you had</h3><p class="help">Optional. Quick taps help our chefs most.</p>';
  visible.forEach((d, i) => {
    const key = 'dish:' + d.name;
    D[d.name] = D[d.name] || blank();
    const a = D[d.name];
    h += '<div class="card dish"><div class="dish-head"><span class="dish-name">' + esc(d.name) + '</span>' + (d.qty > 1 ? '<span class="dish-qty">x' + d.qty + '</span>' : '') + '</div>';
    h += stars(key, a.rating, 'Rate ' + d.name);
    if (a.rating && a.rating <= 3) h += followup(key, a, 'What was wrong with the ' + d.name + '?', 'dish', true);
    h += '</div>';
  });
  if (!showAll && list.length > 5) h += '<button type="button" class="btn ghost block skip" id="showAll" style="margin-top:14px">Show all ' + list.length + ' dishes</button>';
  return h + '</div>';
}

function renderStep() {
  const s = STEPS[step];
  const el = $('p-step');
  let h = '<div class="kicker">' + esc(s.name) + '</div><h1 class="q" id="stepTitle" tabindex="-1">' + esc(s.q) + '</h1><p class="help">' + esc(s.help) + '</p>';
  if (s.key === 'other') {
    const low = ratedLow();
    h += '<div class="card"><label class="field" for="t-other">Your comments</label><textarea id="t-other" data-text="other" placeholder="Optional" maxlength="1500">' + esc(other.text) + '</textarea>';
    if (low) h += '<label style="display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:15px;cursor:pointer"><input type="checkbox" id="contactOk" style="width:22px;height:22px;margin-top:1px;flex:none"' + (other.contactOk ? ' checked' : '') + '> <span>You can contact me about my feedback so the team can put things right.</span></label>';
    h += '</div>';
  } else {
    const a = A[s.key];
    h += '<div class="card">' + stars(s.key, a.rating, s.q) + '<div class="scale"><span>Poor</span><span>Excellent</span></div>' + wordLine(a.rating);
    if (a.rating && a.rating <= 3) h += followup(s.key, a, s.sorry, s.key, false);
    else if (a.rating) h += praise(s.key, a);
    h += '</div>';
    if (s.key === 'food') h += dishBlock();
    h += '<button type="button" class="link skip" data-skip="' + s.key + '">' + esc(s.skip || 'Skip this one') + '</button>';
  }
  el.innerHTML = h;
  enterKey = null;
  updateChrome();
}

function ratedLow() {
  return Object.values(A).some((a) => a.rating && a.rating <= 3) || Object.values(D).some((a) => a.rating && a.rating <= 3);
}
function updateChrome() {
  const s = STEPS[step];
  $('progress').hidden = false;
  $('barFill').style.width = ((step + 1) / STEPS.length * 100) + '%';
  $('barWrap').setAttribute('aria-valuenow', step + 1);
  $('stepLabel').textContent = 'Step ' + (step + 1) + ' of ' + STEPS.length;
  $('stepName').textContent = s.name;
  const a = A[s.key];
  const answered = s.key === 'other' || (a && (a.rating || a.skipped));
  $('nextBtn').textContent = step === STEPS.length - 1 ? (sending ? 'Sending...' : 'Send feedback') : 'Next';
  $('nextBtn').disabled = !answered || sending;
  $('backBtn').textContent = 'Back';
}

function show(id) {
  ['loading', 'welcome', 'step', 'thanks', 'done', 'expired', 'error'].forEach((n) => $('p-' + n).classList.toggle('on', n === id));
  const inSurvey = id === 'step' || id === 'welcome';
  $('actions').hidden = !inSurvey;
  $('progress').hidden = id !== 'step';
  if (id === 'welcome') { $('backBtn').style.display = 'none'; $('nextBtn').textContent = 'Start'; $('nextBtn').disabled = false; }
  else $('backBtn').style.display = '';
  window.scrollTo(0, 0);
}
function focusHeading(id) { const e = $(id); if (e) { try { e.focus({ preventScroll: true }); } catch (x) {} } }

function renderWelcome() {
  const name = data.guestName ? ', ' + esc(data.guestName) : '';
  $('p-welcome').innerHTML =
    '<div class="hero"><h1 id="welcomeTitle" tabindex="-1">Thanks for visiting' + name + '</h1>' +
    '<p>You dined with us at Tap &amp; Tandoor ' + esc(data.site) + (data.visitDate ? ' on ' + esc(data.visitDate) : '') + '. Tell us how it went. We read every response.</p></div>' +
    '<ul class="facts"><li><span class="dot"></span><span><b>About a minute.</b> Five quick taps, one for each part of your visit.</span></li>' +
    '<li><span class="dot"></span><span><b>Just for you.</b> This link works once, so it cannot be shared or used again after you send it.</span></li>' +
    '<li><span class="dot"></span><span><b>No sign-up.</b> Nothing to download and no account to make.</span></li></ul>';
}

function stateScreen(id, icon, title, body) {
  $('p-' + id).innerHTML = '<div class="end"><div class="badge soft">' + icon + '</div><h1 id="' + id + 'Title" tabindex="-1">' + title + '</h1><p>' + body + '</p><p><a class="btn primary block" style="max-width:320px;margin:20px auto 0" href="https://www.tapandtandoor.co.uk">Visit our website</a></p></div>';
}
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

function average() {
  const r = ['food', 'drink', 'service', 'atmosphere'].map((k) => A[k].rating).filter(Boolean);
  return r.length ? r.reduce((x, y) => x + y, 0) / r.length : null;
}
function renderThanks() {
  const avg = average();
  const health = A.food.tags.includes('health');
  const happy = avg !== null && avg >= 4 && !ratedLow();
  let h = '<div class="end"><div class="badge">' + ICON_CHECK + '</div>';
  if (happy) {
    h += '<h1 id="thanksTitle" tabindex="-1">Thank you, that made our day</h1><p>If you have another minute, a Google review helps other people find us.</p>';
    if (data.googleReviewUrl) h += '<p><a class="btn primary block" style="max-width:340px;margin:18px auto 0" href="' + esc(data.googleReviewUrl) + '" target="_blank" rel="noopener">Review us on Google</a></p>';
  } else {
    h += '<h1 id="thanksTitle" tabindex="-1">Thank you for telling us</h1><p>The ' + esc(data.site) + ' team will read what you wrote. We are sorry we did not get everything right and we want to do better.</p>';
    if (health) h += healthAlert();
  }
  h += '<p style="font-size:14px;color:var(--muted);margin-top:22px">This link has now been used and cannot be opened again.</p></div>';
  $('p-thanks').innerHTML = h;
}

function payload() {
  const cats = {};
  Object.keys(A).forEach((k) => { const a = A[k]; cats[k] = { rating: a.rating, skipped: a.skipped, tags: a.tags, comment: a.text.trim() }; });
  const dishes = Object.keys(D).filter((n) => D[n].rating).map((n) => ({ dish: n, rating: D[n].rating, tags: D[n].tags, comment: D[n].text.trim() }));
  return { categories: cats, dishes, other: other.text.trim(), contactOk: !!other.contactOk, flaggedHealth: A.food.tags.includes('health') };
}
async function submit() {
  if (sending) return;
  sending = true; updateChrome();
  try {
    if (DEMO) { await new Promise((r) => setTimeout(r, 700)); console.log('Survey payload', payload()); }
    else {
      const token = location.pathname.split('/').filter(Boolean).pop();
      const res = await fetch('/api/survey/' + encodeURIComponent(token) + '/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload()) });
      if (res.status === 409 || res.status === 410) { sending = false; clearDraft(); stateScreen('done', ICON_CHECK, 'This survey has already been completed', 'Each link can only be used once. Thank you for your feedback.'); show('done'); return; }
      if (!res.ok) throw new Error('bad status');
    }
    clearDraft(); sending = false;
    renderThanks(); show('thanks'); focusHeading('thanksTitle');
  } catch (e) {
    sending = false; updateChrome();
    alertInline('We could not send that. Check your connection and tap Send feedback again. Your answers are still here.');
  }
}
function alertInline(msg) {
  let box = $('inlineErr');
  if (!box) { box = document.createElement('div'); box.id = 'inlineErr'; box.className = 'alert'; box.setAttribute('role', 'alert'); $('p-step').prepend(box); }
  box.textContent = msg;
}

/* Events */
document.addEventListener('click', (e) => {
  const star = e.target.closest('.star');
  if (star) {
    const group = star.closest('[data-stars]').getAttribute('data-stars');
    const v = Number(star.getAttribute('data-v'));
    const isDish = group.startsWith('dish:');
    const a = isDish ? D[group.slice(5)] : A[group];
    const wasLow = a.rating && a.rating <= 3;
    a.rating = v; a.skipped = false;
    if (v >= 4 && wasLow) { a.tags = []; a.text = ''; }
    if (v <= 3 && !wasLow) enterKey = group;
    renderStep(); saveDraft();
    const again = $('s-' + group + '-' + v); if (again) { again.focus({ preventScroll: true }); again.classList.add('pop'); }
    return;
  }
  const chip = e.target.closest('.chip');
  if (chip) {
    const key = chip.closest('[data-chips]').getAttribute('data-chips');
    const a = key.startsWith('dish:') ? D[key.slice(5)] : A[key];
    const t = chip.getAttribute('data-tag');
    const i = a.tags.indexOf(t);
    if (i > -1) a.tags.splice(i, 1); else a.tags.push(t);
    chip.setAttribute('aria-pressed', String(i === -1));
    if (t === 'health') { renderStep(); const c = document.querySelector('[data-chips="' + CSS.escape(key) + '"] [data-tag="health"]'); if (c) c.focus({ preventScroll: true }); }
    saveDraft(); return;
  }
  const cm = e.target.closest('[data-comment]');
  if (cm) { const k = cm.getAttribute('data-comment'); A[k].comment = true; renderStep(); const t = $('t-' + k); if (t) t.focus(); return; }
  const sk = e.target.closest('[data-skip]');
  if (sk) { const k = sk.getAttribute('data-skip'); A[k] = Object.assign(blank(), { skipped: true }); goNext(); return; }
  if (e.target.id === 'showAll') { showAll = true; renderStep(); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('textarea[data-text]')) {
    const k = t.getAttribute('data-text');
    if (k === 'other') other.text = t.value;
    else if (k.startsWith('dish:')) D[k.slice(5)].text = t.value;
    else A[k].text = t.value;
    saveDraft();
  }
  if (t.id === 'contactOk') { other.contactOk = t.checked; saveDraft(); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'contactOk') { other.contactOk = e.target.checked; saveDraft(); } });

function goNext() {
  if (step === -1) { step = 0; renderStep(); show('step'); focusHeading('stepTitle'); saveDraft(); return; }
  if (step === STEPS.length - 1) { submit(); return; }
  step++; renderStep(); show('step'); focusHeading('stepTitle'); saveDraft();
}
function goBack() {
  if (step <= 0) { step = -1; show('welcome'); focusHeading('welcomeTitle'); return; }
  step--; renderStep(); show('step'); focusHeading('stepTitle'); saveDraft();
}
$('nextBtn').addEventListener('click', goNext);
$('backBtn').addEventListener('click', goBack);

/* Start */
async function boot() {
  show('loading');
  $('demoNav').hidden = !DEMO;
  try {
    if (DEMO) data = Object.assign({}, DEMO_DATA, { status: location.hash === '#done' ? 'completed' : location.hash === '#expired' ? 'expired' : 'open' });
    else {
      const token = location.pathname.split('/').filter(Boolean).pop();
      const res = await fetch('/api/survey/' + encodeURIComponent(token));
      if (res.status === 404) throw new Error('missing');
      data = await res.json();
    }
  } catch (e) {
    stateScreen('error', ICON_CLOCK, 'We could not find that survey', 'Please check the link in your email. If it still does not work, tell a member of the team next time you visit.');
    show('error'); return;
  }
  $('sitePill').textContent = data.site;
  if (data.status === 'completed') { stateScreen('done', ICON_CHECK, 'This survey has already been completed', 'Each link can only be used once, so it cannot be opened again. Thank you for your feedback.'); show('done'); return; }
  if (data.status === 'expired') { stateScreen('expired', ICON_CLOCK, 'This link has expired', 'Survey links stay open for 14 days after your visit. We would still love to hear from you next time.'); show('expired'); return; }
  (data.dishes || []).forEach((d) => { D[d.name] = D[d.name] || blank(); });
  loadDraft();
  renderWelcome();
  if (step >= 0) { renderStep(); show('step'); } else show('welcome');
}
window.addEventListener('hashchange', () => { if (DEMO) location.reload(); });
boot();
</script>
</body>
</html>
