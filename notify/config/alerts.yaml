# ---------------------------------------------------------------------------
# Metabase -> ZenZap alert rules.
#
# Each rule: pull rows from Metabase, keep the ones that breach, send one
# message per site to that site's own chat.
#
# Add a rule here, not in code. `jobs/metabase_alerts.py` is generic.
#
# STATE, 20 Aug 2026: only `daily-site-brief` is enabled. Everything else is
# shelved at Ajay's request until a message schedule is agreed. The disabled
# rules are tested and ready — flipping `enabled: true` is all that's needed.
#
# Test any rule without sending:
#     python -m notify.brief --rule <key> --dry-run
# ---------------------------------------------------------------------------

defaults:
  database: 2                 # neondb = Tap & Tandoor
  site_column: site_name      # column holding the Nory site name
  max_sites_per_run: 5        # refuse to send more than this in one go

rules:

  # -------------------------------------------------------------------------
  - key: daily-site-brief
    enabled: true
    title: Morning brief — last night, then today
    schedule: "0 11 * * *"      # 11:00 daily, all sites
    description: >
      The one message every site gets every day. Reads back-to-front on
      purpose: last night is what they already have an opinion about, so it
      earns attention, and today is what they can still change.

      Sales value is deliberately absent — GMs have their own number in their
      head and any mismatch destroys trust in the whole message. Spend per
      head, wet/dry and drinks per cover are the levers they actually control.

      MONETARY EFFECT: computed as hours variance x the site's OWN actual
      hourly rate, NOT as (col - planned_col). Nory's planned_col runs at
      £19.70-£25.68/hr against an actual of £14.76-£16.14 — a different cost
      basis (almost certainly fully-loaded: NI, pension, holiday accrual).
      Subtracting them shows every site "saving" money every night, including
      Solihull on 18 Aug when it worked 0.5 hrs OVER schedule. Deriving from
      hours keeps the £ consistent with the hours on the line above it.

      Joins on business_location_id where possible; Nory joins by site name,
      which matches the bookings naming ("Solihull"), not the POS naming
      ("Tap Solihull").
    sql: |
      WITH ln AS (
        -- Covers come from v_site_day_apc.covers_clean, NOT v_site_day.covers,
        -- so covers x spend-per-head actually equals dining revenue. The two
        -- views count differently (124 vs 120 at Solihull on 19 Aug) and a GM
        -- who checks the arithmetic and finds it doesn't tie stops trusting
        -- every other number in the message.
        SELECT sd.business_location_id AS loc, sd.business_date,
               a.covers_clean               AS covers,
               ROUND(sd.wet_pct)            AS wet_pct,
               ROUND(sd.dry_pct)            AS dry_pct,
               ROUND(sd.drinks_per_cover,2) AS dpc,
               ROUND(a.apc_dining,2)        AS apc
        FROM v_site_day sd
        LEFT JOIN v_site_day_apc a
               ON a.business_location_id = sd.business_location_id
              AND a.biz_date = sd.business_date
        WHERE sd.business_date = CURRENT_DATE - 1
      ),
      lw AS (   -- same weekday last week: the only fair comparison in hospitality
        SELECT business_location_id AS loc, covers_clean AS covers_lw
        FROM v_site_day_apc WHERE biz_date = CURRENT_DATE - 8
      ),
      sitemap AS (   -- bookings carries both the id and the Nory-style name
        SELECT DISTINCT site, business_location_id AS loc
        FROM v_bookings_site_day WHERE business_location_id IS NOT NULL
      ),
      lab AS (
        SELECT m.loc,
               n.hours          AS act_hours,
               n.planned_hours  AS sch_hours,
               ROUND(n.hours - n.planned_hours, 1) AS hrs_var,
               -- see description: derive £ from hours x the site's own actual rate
               ROUND((n.hours - n.planned_hours) * (n.col / NULLIF(n.hours,0))) AS money_var
        FROM nory_labour_daily n
        JOIN sitemap m ON m.site = n.site_name
        WHERE n.biz_date = CURRENT_DATE - 1
      ),
      tb AS (
        SELECT business_location_id AS loc, live_covers, live_bookings
        FROM v_bookings_site_day WHERE booking_date = CURRENT_DATE
      ),
      pace AS (  -- typical same-day walk-ins for this weekday, 12-week average
        SELECT m.loc,
               ROUND(p.avg_sameday_covers) AS exp_walkins,
               ROUND(p.avg_total_covers)   AS typical_total
        FROM v_booking_pace_dow p
        JOIN sitemap m ON m.site = p.site
        WHERE p.dow_iso = EXTRACT(ISODOW FROM CURRENT_DATE)
      )
      SELECT ln.loc::text AS location_id,
             ln.business_date,
             CURRENT_DATE  AS today,
             ln.covers, ln.apc, ln.wet_pct, ln.dry_pct, ln.dpc,
             lw.covers_lw,
             lab.act_hours, lab.sch_hours, lab.hrs_var,
             ABS(lab.money_var)                                        AS money_abs,
             CASE WHEN lab.hrs_var > 0 THEN 'over' ELSE 'under' END    AS hrs_dir,
             CASE WHEN lab.hrs_var > 0 THEN 'cost'  ELSE 'saved' END   AS money_dir,
             ABS(lab.hrs_var)                                          AS hrs_abs,
             COALESCE(tb.live_covers, 0)   AS booked_today,
             COALESCE(tb.live_bookings, 0) AS bookings_today,
             pace.exp_walkins,
             pace.typical_total,
             COALESCE(tb.live_covers,0) + COALESCE(pace.exp_walkins,0) AS expect_total,
             -- Wednesday-only nudge. Empty string the rest of the week, so the
             -- template renders identically and no placeholder is left behind.
             CASE WHEN EXTRACT(ISODOW FROM CURRENT_DATE) = 3
                  THEN E'\n\n📋 It is Wednesday today. Please start planning your rotas for the following week.'
                  ELSE '' END AS rota_note
      FROM ln
      LEFT JOIN lw   ON lw.loc   = ln.loc
      LEFT JOIN lab  ON lab.loc  = ln.loc
      LEFT JOIN tb   ON tb.loc   = ln.loc
      LEFT JOIN pace ON pace.loc = ln.loc
      ORDER BY ln.loc
    condition: always            # a brief, not an alert — always sends
    route: site
    sport_block: true        # append today's live sport (see notify/sport.py)
    message: |
      *{site_display}*

      *Last night — {business_date:date}*
      Dine-in covers: {covers}  (same day last week: {covers_lw})
      Dine-in spend per head: £{apc}
      Wet / dry: {wet_pct}% / {dry_pct}%
      Drinks per cover: {dpc}
      Hours: {act_hours} actual v {sch_hours} scheduled — {hrs_abs} {hrs_dir} (£{money_abs} {money_dir})

      *Today — {today:date}*
      Booked: {booked_today} covers ({bookings_today} bookings)
      Typical walk-ins: {exp_walkins}
      Expect around {expect_total} — a normal one is {typical_total}{rota_note}

  # -------------------------------------------------------------------------

  # --- Weekly sports bookings, head office only -----------------------------
  - key: weekly-sports-bookings
    enabled: true
    title: Weekly sports bookings
    schedule: "0 10 * * 1"         # Mondays 10:00 — prior full week, Mon-Sun
    route: group:head_office       # NOT site staff: see description
    description: >
      Sky and TNT cost the group ~£118k a year. This is the only regular read
      on what books against it. Head Office only, deliberately: it is a cost
      question, not something site teams can act on in the week.

      Bookings and covers ONLY. Cost per cover was specified in the original
      brief and is deliberately absent, because the metric cannot support the
      weight it would carry: a walk-in cannot select an offer, so pre-booked
      sports covers are structurally blind to exactly the trade a football
      town generates. Ranking sites on it would have read as a verdict on
      GMs. Add it when booking-level SPEND is attributable, not before.

      Counts any FavouriteTable offer naming sport, a World Cup, a Nations
      Championship, or a fixture in "X v Y" form — sites create ad-hoc offers
      per fixture, and matching only "Live Sports Booking" misses a fifth of
      them. Cancelled bookings excluded.
    sql: |
      with bounds as (
        select (date_trunc('week', current_date)::date - 7)  as wk_start,
               (date_trunc('week', current_date)::date - 1)  as wk_end,
               (date_trunc('week', current_date)::date - 14) as pr_start,
               (date_trunc('week', current_date)::date - 8)  as pr_end
      ),
      sports as (
        select vb.business_location_id, vb.site, vb.booking_date, vb.covers
        from bookings b
        join v_bookings vb using (booking_ref_no)
        where coalesce(vb.is_cancelled, false) = false
          and (b.raw->>'OfferName' ilike '%sport%'
            or b.raw->>'OfferName' ilike '%world cup%'
            or b.raw->>'OfferName' ilike '%nations championship%'
            or b.raw->>'OfferName' ~* '\mv\M')
      ),
      per_site as (
        select s.business_location_id, s.site,
          count(*) filter (where s.booking_date between b.wk_start and b.wk_end) as bk,
          coalesce(sum(s.covers) filter (where s.booking_date between b.wk_start and b.wk_end),0) as cv,
          count(*) filter (where s.booking_date between b.pr_start and b.pr_end) as bk_pr,
          coalesce(sum(s.covers) filter (where s.booking_date between b.pr_start and b.pr_end),0) as cv_pr
        from sports s cross join bounds b
        group by 1,2
      )
      select
        to_char((select wk_start from bounds), 'DD Mon')   as wk_start,
        to_char((select wk_end   from bounds), 'DD Mon')   as wk_end,
        (select sum(bk) from per_site)                     as total_bookings,
        (select sum(cv) from per_site)                     as total_covers,
        (select case when sum(bk)-sum(bk_pr) > 0 then '+' else '' end
                || (sum(bk)-sum(bk_pr))::text from per_site) as wow_bookings,
        (select case when sum(cv)-sum(cv_pr) > 0 then '+' else '' end
                || (sum(cv)-sum(cv_pr))::text from per_site) as wow_covers,
        (select string_agg(
           format('• %-14s %3s covers / %s bookings  %s',
                  site, cv, bk,
                  case when cv - cv_pr > 0 then '▲ ' || (cv - cv_pr)
                       when cv - cv_pr < 0 then '▼ ' || abs(cv - cv_pr)
                       else '—' end),
           E'\n' order by cv desc, site)
         from per_site)                                    as site_lines
    condition: always
    message: |
      *SPORTS BOOKINGS — w/c {wk_start}*
      {wk_start} to {wk_end}, pre-booked only

      Estate: {total_bookings} bookings / {total_covers} covers
      Week on week: {wow_bookings} bookings, {wow_covers} covers

      {site_lines}

      _Walk-in sport trade isn't captured — a walk-in can't select an offer,
      so these are a floor, not the whole picture._
      _Peterborough had no Live Sports booking option on the website until
      22 Aug 2026, so its earlier weeks read zero for that reason. Remove
      this note once a few clean weeks have passed._


  # --- Christmas bookings, daily, head office only --------------------------
  # Requested 9 Oct 2026. Every non-cancelled booking dined 1-31 Dec, per site,
  # with the change since the previous morning's snapshot.
  - key: christmas-bookings
    enabled: true                  # live from 9 Oct 2026 (Ajay: first send 11:00 today)
    title: Christmas bookings (December), day on day
    schedule: "0 12 * 10-12 *"     # 12:00 daily, Oct-Dec only
    route: group:head_office
    description: >
      Counts every booking with a dine date of 1-31 December that is not
      cancelled (Bournemouth Darts folded into Bournemouth). Guests = FT
      GuestCount.

      The day-on-day change is the difference between the two most recent
      rows in christmas_snapshots, which `ingest.christmas` writes each
      morning after the 09:30 bookings refresh. FT does not timestamp
      cancellations, so a snapshot is the only honest way to say "up or down".
      On the very first day there is no earlier snapshot, so the change is
      ESTIMATED from booking-made dates (and says so); that estimate ignores
      anything cancelled since, so treat it as indicative.

      STALENESS: if the snapshot is older than today the message says so
      rather than quietly reporting old numbers as current.
    sql: |
      with latest as (select max(snap_date) as d from christmas_snapshots),
      prior as (
        select max(snap_date) as d from christmas_snapshots
        where snap_date < (select d from latest)
      ),
      cur as (select * from christmas_snapshots where snap_date = (select d from latest)),
      prv as (select * from christmas_snapshots where snap_date = (select d from prior)),
      est as (   -- first-day fallback: bookings that already existed yesterday
        select case when site_name = 'Bournemouth (Darts)' then 'Bournemouth' else site_name end as site_name,
               count(*) as bookings, coalesce(sum(guest_count), 0) as guests
        from bookings
        where booking_date between make_date(extract(year from current_date)::int, 12, 1)
                               and make_date(extract(year from current_date)::int, 12, 31)
          and status is distinct from 'Cancelled'
          and (created_on at time zone 'Europe/London')::date < (select d from latest)
        group by 1
      ),
      per_site as (
        select c.site_name, c.bookings as bk, c.guests as gu,
               coalesce(p.bookings, e.bookings, 0) as bk_prev,
               coalesce(p.guests,   e.guests,   0) as gu_prev
        from cur c
        left join prv p using (site_name)
        left join est e using (site_name)
      )
      select
        (select count(*) from prv) = 0                         as first_day,
        to_char((select d from latest), 'DD Mon')              as as_of,
        sum(bk)                                                as total_bookings,
        sum(gu)                                                as total_guests,
        case when sum(bk) - sum(bk_prev) > 0 then '▲ ' || (sum(bk) - sum(bk_prev))
             when sum(bk) - sum(bk_prev) < 0 then '▼ ' || abs(sum(bk) - sum(bk_prev))
             else '—' end                                      as total_bk_chg,
        case when sum(gu) - sum(gu_prev) > 0 then '▲ ' || (sum(gu) - sum(gu_prev))
             when sum(gu) - sum(gu_prev) < 0 then '▼ ' || abs(sum(gu) - sum(gu_prev))
             else '—' end                                      as total_gu_chg,
        string_agg(
          format('• *%s*: %s bookings (%s) | %s guests (%s)',
                 site_name, bk,
                 case when bk - bk_prev > 0 then '▲ ' || (bk - bk_prev)
                      when bk - bk_prev < 0 then '▼ ' || abs(bk - bk_prev)
                      else '—' end,
                 gu,
                 case when gu - gu_prev > 0 then '▲ ' || (gu - gu_prev)
                      when gu - gu_prev < 0 then '▼ ' || abs(gu - gu_prev)
                      else '—' end),
          E'\n' order by site_name)                            as site_lines,
        case
          when (select d from latest) < (now() at time zone 'Europe/London')::date
            then E'\n_⚠ Snapshot is from ' || to_char((select d from latest), 'DD Mon')
                 || ' - today''s refresh has not landed, so these are not today''s numbers._'
          when (select count(*) from prv) = 0
            then E'\n_First reading: the change is estimated from booking-made dates and ignores anything cancelled since. Exact from tomorrow._'
          else '' end                                          as note
      from per_site
    condition: always
    message: |
      *CHRISTMAS BOOKINGS*
      1-31 Dec dine dates, vs yesterday's reading. Figures as of {as_of}.

      *Estate:* {total_bookings} bookings ({total_bk_chg}) | {total_guests} guests ({total_gu_chg})

      {site_lines}
      {note}


  # --- Portsmouth: per-server APC, for Alice --------------------------------
  - key: portsmouth-server-apc
    enabled: true
    title: Portsmouth server APC (for Alice)
    schedule: "0 11 * * *"         # daily 11:00, alongside the site brief
    route: site                    # the SQL returns Portsmouth only
    description: >
      Requested 25 Aug 2026: last night's dine-in spend per head, per server,
      addressed to Alice. Portsmouth only — the query is hard-filtered to
      business_location_id 1718940401139718, so `route: site` sends the one
      row to the Portsmouth chat and nowhere else.

      Covers only people who RANG dine-in covers, so it is not the rota:
      kitchen, bar and anyone who didn't open a table won't appear. Ordered
      by APC, not covers, because the point is spend per head.

      `hours` on v_staff_scorecard_day is deliberately NOT used — it reads
      17.5 for a single evening shift, so it is measuring something other
      than time worked and would undermine trust in the rest of the message.
    sql: |
      with d as (
        select max(business_date) as bd
        from v_staff_scorecard_day
        where business_location_id = 1718940401139718
      ),
      staff as (
        select s.staff, s.covers,
               round(s.sales_exvat / nullif(s.covers, 0), 2) as apc
        from v_staff_scorecard_day s, d
        where s.business_location_id = 1718940401139718
          and s.business_date = d.bd
          and s.covers > 0
      )
      select
        '1718940401139718'                              as location_id,
        (select bd from d)                              as business_date,
        (select count(*) from staff)                    as n_staff,
        (select sum(covers) from staff)                 as site_covers,
        (select string_agg(
           format('%-12s %3s covers   £%s per head', staff, covers, apc),
           E'\n' order by apc desc)
         from staff)                                    as staff_lines,
        (select staff from staff order by apc desc limit 1)      as top_staff,
        (select to_char(apc, 'FM999990.00') from staff order by apc desc limit 1) as top_apc
    condition: always
    message: |
      Morning Alice — Portsmouth servers last night ({business_date:date})

      {staff_lines}

      {n_staff} servers, {site_covers} dine-in covers.
      Best per head: {top_staff} at £{top_apc}.

      _Dine-in covers only — anyone who didn't open a table won't show here._


  # --- FT vs LS covers reconciliation, per site -----------------------------
  - key: ft-vs-ls-covers
    enabled: true
    title: FT vs LS covers
    schedule: "0 11 * * *"         # daily 11:00, with the brief
    route: site
    description: >
      Requested 26 Aug 2026. FavouriteTable and Lightspeed should show
      roughly the same covers for a night; a persistent gap means either
      bookings weren't marked as arrived in FT, or covers weren't keyed on
      the till. Both make every cover-based figure we report less reliable.

      FT side is `shown_covers`, which ALREADY includes walk-ins (FT logs
      them as sale_channel_code 5), so the two are genuinely comparable —
      this is not just measuring walk-in trade.

      LS side is cleaned, not raw: darts and shuffleboard checks carry cover
      counts and would otherwise inflate Bournemouth every night. Cleaning
      removes roughly 2-11 covers a day and the gap mostly survives it, so
      what's left is a real discrepancy rather than an artefact.

      The Bournemouth Darts FT venue is deliberately excluded — it has FT
      bookings but no till of its own, so it would report a permanent
      "FT is higher" that nobody can act on.
    sql: |
      with ls as (
        select business_location_id, biz_date,
               sum(nb_covers) filter (where is_dining_check) as ls_covers
        from v_covers_clean
        where biz_date = current_date - 1
        group by 1,2
      )
      select u.business_location_id::text          as location_id,
             u.site                                as site_name,
             u.biz_date                            as business_date,
             coalesce(u.shown_covers, 0)           as ft_covers,
             coalesce(ls.ls_covers, 0)             as ls_covers,
             abs(coalesce(ls.ls_covers,0) - coalesce(u.shown_covers,0)) as gap,
             case
               when coalesce(ls.ls_covers,0) = coalesce(u.shown_covers,0) then 'they match'
               when coalesce(ls.ls_covers,0) >  coalesce(u.shown_covers,0) then 'LS is higher'
               else 'FT is higher'
             end                                   as direction
      from v_unified_site_day u
      left join ls on ls.business_location_id = u.business_location_id
                  and ls.biz_date = u.biz_date
      where u.biz_date = current_date - 1
        and u.business_location_id in (1718940401139714, 1718940401139717,
                                       1718940401139718, 1718940401139719,
                                       1718940401139720)
    condition: always
    message: |
      *FT vs LS COVERS — {business_date:date}*

      FT: {ft_covers}
      LS: {ls_covers}
      Difference: {gap} — {direction}

      _These should track closely. A gap usually means bookings weren't
      marked as arrived in FavouriteTable, or covers weren't put in on the
      till._

  - key: labour-hours-over
    enabled: false
    title: Labour hours over schedule
    schedule: "15 9 * * *"      # 09:15 daily, after the overnight Nory sync
    description: >
      Actual hours worked exceeded scheduled hours for the last completed
      trading day. Uses HOURS, not labour %, because the sales column in
      nory_labour_daily is unreliable — see the data-quality note below.
    sql: |
      SELECT site_name,
             biz_date,
             hours,
             planned_hours,
             ROUND(hours - planned_hours, 1)                         AS hours_var,
             ROUND(((hours - planned_hours) / NULLIF(planned_hours,0)) * 100, 1) AS pct_var,
             col                                                     AS labour_cost,
             planned_col                                             AS planned_labour_cost,
             sales
      FROM nory_labour_daily
      WHERE biz_date = (SELECT MAX(biz_date) FROM nory_labour_daily)
    condition:
      # Both must trip. One alone means small sites alert on rounding and
      # get trained to ignore it.
      all:
        - column: hours_var
          op: ">="
          value: 2.0
        - column: pct_var
          op: ">="
          value: 5.0
    message: |
      *Labour hours over schedule — {site_display}*
      {biz_date:date}

      Scheduled: {planned_hours} hrs
      Actual:    {hours} hrs
      Over by:   {hours_var} hrs ({pct_var}%)

      Worth a look at what drove it.
    route: site


  # -------------------------------------------------------------------------
  - key: labour-hours-saved
    enabled: false
    title: Came in under schedule — well done
    schedule: "15 9 * * *"
    description: >
      The other half of labour-hours-over. A system that only ever messages
      people when something is wrong gets read as nagging and stops working
      within a month. Same thresholds as the overrun rule, inverted, so
      praise is as hard to earn as criticism is — which is what makes it
      worth anything.
    sql: |
      SELECT site_name,
             biz_date,
             hours,
             planned_hours,
             ROUND(planned_hours - hours, 1)                                     AS hours_saved,
             ROUND(((planned_hours - hours) / NULLIF(planned_hours,0)) * 100, 1)  AS pct_saved
      FROM nory_labour_daily
      WHERE biz_date = (SELECT MAX(biz_date) FROM nory_labour_daily)
    condition:
      all:
        - column: hours_saved
          op: ">="
          value: 2.0
        - column: pct_saved
          op: ">="
          value: 5.0
    message: |
      *Nice one, {site_display}* 👏
      {biz_date:date}

      Scheduled: {planned_hours} hrs
      Actual:    {hours} hrs
      Came in {hours_saved} hrs under ({pct_saved}%)

      Good control of the shift — thanks.
    route: site

  # -------------------------------------------------------------------------
  - key: labour-pct-over-target
    # DISABLED. Do not enable until the sales column is fixed.
    #
    # Southampton and Peterborough report sales = 0 on every row in
    # nory_labour_daily, which makes their labour % 0.0 — indistinguishable
    # from "excellent" rather than "no data". The other three sites show
    # 26%-78% swings that look more like partial sales sync than real
    # performance. An alert on this today would be silently blind to two
    # sites and noisy on the rest.
    #
    # Fix the Nory sales sync first, then flip enabled to true.
    enabled: false
    title: Labour % over 30% target
    schedule: "15 9 * * *"
    sql: |
      SELECT site_name, biz_date, percentage AS labour_pct, sales, col AS labour_cost
      FROM nory_labour_daily
      WHERE biz_date = (SELECT MAX(biz_date) FROM nory_labour_daily)
        AND sales > 0          -- guard: never treat missing sales as 0%
    condition:
      all:
        - column: labour_pct
          op: ">"
          value: 30.0
    message: |
      *Labour {labour_pct}% of sales — {site_display}*
      {biz_date:date}

      Target is 30%.
      Labour £{labour_cost} on £{sales} sales.
    route: site

  # -------------------------------------------------------------------------
  - key: nory-sales-not-syncing
    enabled: false
    title: Nory sales feed is down for a site
    schedule: "30 9 * * *"
    description: >
      Data-quality alarm, not an ops alert. If sales is 0 the labour % is
      meaningless, and any % based rule goes quietly blind for that site.
      This is currently firing for Southampton and Peterborough every day.
    sql: |
      SELECT site_name,
             biz_date,
             COUNT(*)                                    AS days_checked,
             SUM(CASE WHEN sales = 0 THEN 1 ELSE 0 END)  AS days_zero
      FROM nory_labour_daily
      WHERE biz_date >= CURRENT_DATE - INTERVAL '7 days'
      GROUP BY site_name, biz_date
      HAVING SUM(CASE WHEN sales = 0 THEN 1 ELSE 0 END) > 0
    condition:
      all:
        - column: days_zero
          op: ">="
          value: 1
    # Goes to Ajay, not to the site — nobody at site level can fix a sync.
    route: none
    message: |
      *Nory sales not syncing — {site_display}*
      No sales figure on {biz_date:date}. Labour % is unusable for this site
      until the feed is fixed.

  # -------------------------------------------------------------------------
  - key: bookings-briefing
    enabled: true               # refresh service: railway.bookings-refresh.json
    title: Today's bookings to note — large parties, deposits, guest notes
    schedule: "0 10 * * *"      # 10:00 UK daily, each site's own chat
    description: >
      Tells each site, at 10:00, which of today's bookings need attention:
      parties of 10+, paid deposits, guest notes (allergies listed first),
      then a short "Be aware" section for pile-ups.

      Reads the Neon `bookings` table (the Favourite Table GetBookingList
      pull). `deposit` > 0 is treated as a paid deposit (confirmed by Ajay,
      3 Oct 2026). Bournemouth Darts & Shuffleboard (FT 2102) has no location
      id of its own and is folded into Bournemouth here.

      FRESHNESS: the nightly ingest runs ~05:35, so without a refresh just
      before sending, anything booked after that is missing. Before enabling
      the schedule, add a `python -m ingest.bookings --date today` step at
      ~09:55 (needs FT_AUTH_TOKEN on this service).

      Notes are sanitised: braces would break the template renderer and
      asterisks would bold text in ZenZap. "None", "n/a" etc. are ignored.
      Be-aware lines: (1) 2+ large parties starting within 60 min of each
      other; (2) 2+ bookings within 30 min asking for TV / bar / high tables.
    sql: |
      WITH today AS (
        SELECT (now() AT TIME ZONE 'Europe/London')::date AS d
      ),
      bm AS (   -- Darts has no location id; it rolls up to Bournemouth (2082)
        SELECT business_location_id AS loc FROM ft_site_map WHERE ft_site_code = 2082
      ),
      raw_bk AS (
        SELECT COALESCE(b.business_location_id, bm.loc) AS loc,
               (b.ft_site_code = 2102)                  AS is_darts,
               b.booking_time, b.guest_count, b.status_code,
               COALESCE(b.deposit, 0)                   AS deposit,
               btrim(initcap(COALESCE(b.first_name,'')) || ' ' || initcap(COALESCE(b.last_name,''))) AS guest,
               NULLIF(btrim(regexp_replace(
                 replace(replace(replace(replace(COALESCE(b.raw->>'SpecialRequest',''),
                   E'\n',' '), E'\r',' '), '{','('), '}',')'),
                 '[*_]', '', 'g')), '')                 AS note0,
               regexp_replace(regexp_replace(COALESCE(b.raw->>'OfferName',''),
                 '\s*-\s*£.*$', ''), '\s+', ' ', 'g')   AS offer
        FROM bookings b CROSS JOIN today t CROSS JOIN bm
        WHERE b.booking_date = t.d
          AND b.status_code NOT IN (3, 5)               -- cancelled, no-show
      ),
      bk AS (
        SELECT r.*,
               CASE WHEN r.note0 IS NULL
                      OR lower(btrim(r.note0, ' .!-')) IN ('none','n/a','na','nil','no','nothing')
                    THEN NULL
                    ELSE left(r.note0, 160) || CASE WHEN length(r.note0) > 160 THEN '…' ELSE '' END
               END AS note
        FROM raw_bk r
      ),
      fl AS (
        SELECT bk.*,
               to_char(booking_time, 'HH24:MI') AS tm,
               (guest_count >= 10)              AS is_large,
               (deposit > 0)                    AS has_dep,
               COALESCE(note ~* '(allerg|gluten|coeliac|celiac|intoleran|lactose|dairy|\mnuts?\M|peanut|shellfish|sesame)', false) AS is_allergy,
               COALESCE(note ~* '(\mtv\M|telly|screen|\mmatch\M|\msport|view of|bar table|high table|bar area)', false)            AS is_tv,
               to_char(booking_time, 'HH24:MI') || ' — '
                 || CASE WHEN guest = '' THEN 'Guest' ELSE guest END || ', '
                 || guest_count || ' covers'
                 || CASE WHEN is_darts THEN ' (Darts)' ELSE '' END AS base_txt
        FROM bk
      ),
      lc AS (   -- chain large parties that start within 60 min of the previous one
        SELECT loc, booking_time, guest_count,
               SUM(CASE WHEN prev IS NULL OR booking_time - prev > interval '60 minutes' THEN 1 ELSE 0 END)
                 OVER (PARTITION BY loc ORDER BY booking_time, guest_count) AS cl
        FROM (SELECT loc, booking_time, guest_count,
                     lag(booking_time) OVER (PARTITION BY loc ORDER BY booking_time, guest_count) AS prev
              FROM fl WHERE is_large) x
      ),
      lc_txt AS (
        SELECT loc,
               string_agg('• ' || SUM_c || ' covers in large parties starting ' || t0 || CASE WHEN t0 <> t1 THEN '–' || t1 ELSE '' END,
                          E'\n' ORDER BY t0) AS txt
        FROM (SELECT loc, cl, SUM(guest_count) AS SUM_c, COUNT(*) AS n,
                     to_char(MIN(booking_time),'HH24:MI') AS t0, to_char(MAX(booking_time),'HH24:MI') AS t1
              FROM lc GROUP BY loc, cl HAVING COUNT(*) >= 2) z
        GROUP BY loc
      ),
      tc AS (   -- chain TV / bar-table requests that start within 30 min of the previous one
        SELECT loc, booking_time, guest_count,
               SUM(CASE WHEN prev IS NULL OR booking_time - prev > interval '30 minutes' THEN 1 ELSE 0 END)
                 OVER (PARTITION BY loc ORDER BY booking_time, guest_count) AS cl
        FROM (SELECT loc, booking_time, guest_count,
                     lag(booking_time) OVER (PARTITION BY loc ORDER BY booking_time, guest_count) AS prev
              FROM fl WHERE is_tv) x
      ),
      tc_txt AS (
        SELECT loc,
               string_agg('• ' || SUM_c || ' covers across ' || n || ' bookings asking for TV / bar tables, ' || t0
                          || CASE WHEN t0 <> t1 THEN '–' || t1 ELSE '' END,
                          E'\n' ORDER BY t0) AS txt
        FROM (SELECT loc, cl, SUM(guest_count) AS SUM_c, COUNT(*) AS n,
                     to_char(MIN(booking_time),'HH24:MI') AS t0, to_char(MAX(booking_time),'HH24:MI') AS t1
              FROM tc GROUP BY loc, cl HAVING COUNT(*) >= 2) z
        GROUP BY loc
      ),
      agg AS (
        SELECT s.business_location_id AS loc,
               COALESCE(SUM(f.guest_count), 0)                                AS tot_covers,
               COUNT(f.loc)                                                   AS tot_bk,
               COALESCE(SUM(f.guest_count) FILTER (WHERE f.is_darts), 0)      AS darts_covers,
               string_agg('• ' || f.base_txt || CASE WHEN f.status_code = 1 THEN ' (not yet confirmed)' ELSE '' END,
                          E'\n' ORDER BY f.booking_time, f.guest) FILTER (WHERE f.is_large) AS large_txt,
               string_agg('• ' || f.base_txt
                          || CASE WHEN f.offer <> '' THEN ', ' || f.offer ELSE '' END
                          || ', £' || CASE WHEN f.deposit = trunc(f.deposit) THEN trunc(f.deposit)::text
                                           ELSE to_char(f.deposit, 'FM999990.00') END || ' deposit',
                          E'\n' ORDER BY f.booking_time, f.guest) FILTER (WHERE f.has_dep) AS dep_txt,
               string_agg('• ' || f.base_txt || ': "' || f.note || '"',
                          E'\n' ORDER BY f.booking_time, f.guest) FILTER (WHERE f.is_allergy AND f.note IS NOT NULL) AS allergy_txt,
               string_agg('• ' || f.base_txt || ': "' || f.note || '"',
                          E'\n' ORDER BY f.booking_time, f.guest) FILTER (WHERE NOT f.is_allergy AND f.note IS NOT NULL) AS notes_txt
        FROM ft_site_map s
        LEFT JOIN fl f ON f.loc = s.business_location_id
        WHERE s.is_core AND s.ft_site_code <> 2102 AND s.business_location_id IS NOT NULL
        GROUP BY s.business_location_id
      )
      SELECT a.loc::text AS location_id,
             (SELECT d FROM today) AS today,
             CASE WHEN a.tot_bk = 0 THEN 'No bookings on the diary yet today.'
                  ELSE a.tot_covers || ' covers across ' || a.tot_bk || ' bookings'
                       || CASE WHEN a.darts_covers > 0
                               THEN ' (' || (a.tot_covers - a.darts_covers) || ' restaurant, '
                                    || a.darts_covers || ' darts & shuffleboard)'
                               ELSE '' END
             END AS headline,
             concat_ws(E'\n\n',
               CASE WHEN a.large_txt   IS NOT NULL THEN E'*Large parties (10+)*\n' || a.large_txt END,
               CASE WHEN a.dep_txt     IS NOT NULL THEN E'*Deposits paid*\n'       || a.dep_txt   END,
               CASE WHEN a.allergy_txt IS NOT NULL THEN E'*Allergy / dietary*\n'   || a.allergy_txt END,
               CASE WHEN a.notes_txt   IS NOT NULL THEN E'*Guest notes*\n'         || a.notes_txt END,
               CASE WHEN lt.txt IS NOT NULL OR tt.txt IS NOT NULL
                    THEN E'*Be aware*\n' || concat_ws(E'\n', lt.txt, tt.txt) END,
               CASE
                 WHEN a.tot_bk > 0 AND a.large_txt IS NULL AND a.dep_txt IS NULL
                      AND a.allergy_txt IS NULL AND a.notes_txt IS NULL
                   THEN 'Nothing needing special attention today.'
                 WHEN a.tot_bk > 0 AND (a.large_txt IS NULL OR a.dep_txt IS NULL
                      OR (a.allergy_txt IS NULL AND a.notes_txt IS NULL))
                   THEN 'No ' || regexp_replace(array_to_string(array_remove(ARRAY[
                          CASE WHEN a.large_txt IS NULL THEN 'large parties' END,
                          CASE WHEN a.dep_txt   IS NULL THEN 'deposits' END,
                          CASE WHEN a.allergy_txt IS NULL AND a.notes_txt IS NULL THEN 'guest notes' END
                        ], NULL), ', '), ', ([^,]*)$', ' or \1') || ' today.'
               END
             ) AS body,
             -- Freshness guard. ingest/bookings.py RETURNS 0 and only logs a
             -- warning when FT_AUTH_TOKEN is missing, so a half-configured
             -- refresh service looks healthy while this message quietly runs
             -- on last night's data. Surface it in the message instead.
             (SELECT CASE
                WHEN max(first_seen_at) < now() - interval '3 hours'
                  THEN E'\n\n_Booking data last refreshed '
                       || to_char(max(first_seen_at) AT TIME ZONE 'Europe/London', 'HH24:MI')
                       || '. Later bookings may be missing — check the diary._'
                ELSE ''
              END FROM bookings) AS freshness
      FROM agg a
      LEFT JOIN lc_txt lt ON lt.loc = a.loc
      LEFT JOIN tc_txt tt ON tt.loc = a.loc
      ORDER BY a.loc
    condition: always           # every site hears something every day, even if only "nothing to note"
    route: site
    message: |
      *{site_display} — bookings to note, {today:date}*
      {headline}

      {body}{freshness}

  # -------------------------------------------------------------------------
  - key: attendance-clock-check
    enabled: true               # live from 10 Oct 2026 (Ajay approved 9 Oct)
    title: Attendance — chase missing clock-ins/outs, or say well done
    schedule: "0 10 * * *"       # 10:00 UK daily, each site's own chat
    description: >
      Follows the 07:30 "Rota summary" scheduled task. That task writes
      yesterday's Nory timecards to nory_shift_variance; this rule reads them
      back and messages each Tap & Tandoor site's own chat:

        - anyone with NO clock-in or clock-out (record_type missing_punch):
          "did they work, and what times?"
        - anyone who clocked in but never clocked out: "what time did they
          finish?"
        - a site with at least one worked shift and zero missing punches:
          "All your team clocked in and out yesterday, well done."

      Requested by Ajay, 9 Oct 2026. Names, roles and rota times are shown;
      wages are NOT (the chat is visible to the whole site) - they stay in the
      email. Vita/Zindiya is excluded (not on ZenZap; Vijay still gets the
      email). Holidays, kitchen placeholders and unscheduled punches never
      trigger a query.

      FRESHNESS GUARD: sends nothing unless yesterday's rows were (re)loaded
      in the last 6 hours. If the Rota summary failed, or Nory was down, the
      sites hear nothing rather than a false "well done". Schedule is one
      slot (10:00, well after the 07:30 Rota summary and the 08:00 quiet-hours end); if the Rota summary runs
      late that day, no message goes out - run it by hand with
      `python -m notify.brief --rule attendance-clock-check`.

      A site only counts as "perfect" if it has shifts on record, so a site
      with no rows (closed, or a partial load) gets nothing, not praise.
    sql: |
      WITH d AS (
        SELECT ((now() AT TIME ZONE 'Europe/London')::date - 1) AS y
      ),
      fresh AS (
        SELECT 1 AS ok
        FROM nory_shift_variance n
        JOIN d ON n.shift_date = d.y
        WHERE n.loaded_at > now() - interval '6 hours'
        LIMIT 1
      ),
      p AS (
        -- braces would break the template renderer, asterisks/underscores
        -- would format text in ZenZap
        SELECT n.site, n.record_type,
               initcap(trim(regexp_replace(n.employee_name, '[{}*_]', '', 'g'))) AS nm,
               trim(regexp_replace(coalesce(n.role, ''), '[{}*_]', '', 'g'))     AS rl,
               n.sched_start, n.sched_end, n.actual_in, n.actual_out
        FROM nory_shift_variance n
        JOIN d ON n.shift_date = d.y
        WHERE n.site <> 'Vita'
      ),
      agg AS (
        SELECT site,
               count(*) FILTER (WHERE record_type = 'variance')      AS worked,
               count(*) FILTER (WHERE record_type = 'missing_punch') AS flagged,
               string_agg(
                 '• *' || nm || '*'
                 || CASE WHEN rl <> '' THEN ' (' || rl || ')' ELSE '' END
                 || CASE WHEN sched_start IS NOT NULL AND sched_end IS NOT NULL
                         THEN ', rota ' || to_char(sched_start, 'HH24:MI')
                              || '–' || to_char(sched_end, 'HH24:MI')
                         ELSE '' END
                 || ': ' ||
                 CASE
                   WHEN actual_in IS NULL AND actual_out IS NULL
                     THEN 'no clock-in or clock-out. Did they work this shift? If so, what time did they start and finish?'
                   WHEN actual_in IS NOT NULL AND actual_out IS NULL
                     THEN 'clocked in at ' || to_char(actual_in, 'HH24:MI')
                          || ', no clock-out. What time did they finish?'
                   WHEN actual_in IS NULL AND actual_out IS NOT NULL
                     THEN 'clocked out at ' || to_char(actual_out, 'HH24:MI')
                          || ', no clock-in. What time did they start?'
                   ELSE 'punch times need checking. What were their start and finish times?'
                 END,
                 E'\n' ORDER BY sched_start, nm
               ) FILTER (WHERE record_type = 'missing_punch') AS lines
        FROM p
        GROUP BY site
      )
      SELECT a.site AS site_name,
             (SELECT y::text FROM d) AS shift_date,
             CASE WHEN a.flagged > 0
                  THEN 'Please reply in this chat with the answers below so the timesheets can be corrected:'
                       || E'\n\n' || a.lines
                  ELSE 'All your team clocked in and out yesterday, well done.'
             END AS body
      FROM agg a
      JOIN fresh ON true
      WHERE a.flagged > 0 OR a.worked > 0
      ORDER BY a.site
    condition: always           # every site with shifts hears something: a query or a well done
    route: site
    message: |
      *Attendance — {site_display}, {shift_date:date}*

      {body}
