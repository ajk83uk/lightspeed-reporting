<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>T&amp;T Pulse</title>
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/static/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="T&amp;T Pulse" />
<style>
  :root {
    --bg: #0b1120; --card: #131c31; --card-border: #1f2b47;
    --text: #f1f5f9; --muted: #8b98b3; --accent: #d97706;
    --up: #34d399; --down: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { padding: 20px 0 10px; }
  header h1 { font-size: 20px; margin: 0 0 2px; font-weight: 700; letter-spacing: -0.2px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .estate { display: flex; gap: 12px; margin: 14px 0 18px; overflow-x: auto; padding-bottom: 2px; }
  .estate .stat { flex: 1 0 auto; min-width: 104px; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 10px 12px; }
  .estate .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .estate .stat .value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .estate .stat .sub { font-size: 11px; margin-top: 1px; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .card-top h2 { font-size: 16px; margin: 0; font-weight: 700; }
  .card-top .date { color: var(--muted); font-size: 12px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .metric .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
  .metric .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .metric .delta { font-size: 12px; margin-top: 1px; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); }
  .spark { margin-top: 14px; }
  .spark svg { width: 100%; height: 44px; display: block; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--card-border); }
  .section .section-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 8px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini .label { color: var(--muted); font-size: 11px; }
  .mini .value { font-size: 16px; font-weight: 700; margin-top: 1px; }
  .mini .value .sub { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: #0e1626; border: 1px solid var(--card-border); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .period-line { display: flex; justify-content: space-between; font-size: 13px; margin-top: 4px; }
  .period-line .name { color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 22px; }
  .refresh-btn { background: none; border: 1px solid var(--card-border); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .card { cursor: pointer; }

  /* drill-down detail sheet */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20;
    display: none; }
  .sheet-backdrop.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 8vh; z-index: 21;
    background: var(--bg); border-radius: 18px 18px 0 0; border: 1px solid var(--card-border);
    display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.2s ease-out; }
  .sheet.open { transform: translateY(0); }
  .sheet-header { padding: 16px 16px 10px; border-bottom: 1px solid var(--card-border);
    display: flex; justify-content: space-between; align-items: center; flex: 0 0 auto; }
  .sheet-header h2 { margin: 0; font-size: 17px; }
  .sheet-close { background: none; border: none; color: var(--muted); font-size: 22px;
    line-height: 1; padding: 4px 8px; }
  .sheet-body { padding: 12px 16px 24px; overflow-y: auto; flex: 1 1 auto; -webkit-overflow-scrolling: touch; }
  .range-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .range-chip { background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .range-chip.active { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 700; }
  .custom-range { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .custom-range input { background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 13px; flex: 1; }
  .custom-range button { background: var(--card); border: 1px solid var(--card-border); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; }
  .detail-totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .detail-chart { margin-bottom: 16px; }
  .detail-chart svg { width: 100%; height: 90px; display: block; }
  .detail-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .detail-table th { text-align: right; color: var(--muted); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.2px; padding: 6px 6px; position: sticky; top: 0; background: var(--bg); }
  .detail-table th:first-child, .detail-table td:first-child { text-align: left; }
  .detail-table td { text-align: right; padding: 7px 6px; border-top: 1px solid var(--card-border); }
  .detail-empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .detail-loading { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  /* reviews section */
  .review-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-top: 4px; }
  .review-row .name { color: var(--muted); }
  .stars { color: var(--accent); font-weight: 700; }
  .neg-alert { margin-top: 10px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.35);
    border-radius: 10px; padding: 8px 10px; }
  .neg-alert .neg-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--down); font-weight: 700; margin-bottom: 3px; }
  .neg-alert .neg-text { font-size: 12.5px; color: var(--text); line-height: 1.35; }
  .neg-alert + .neg-alert { margin-top: 6px; }

  /* monthly special card */
  .special-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; }
  .special-card .card-top h2 { font-size: 15px; }
  .special-card .card-top .date { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <header>
    <h1>Tap &amp; Tandoor Pulse</h1>
    <p id="asof">Loading last night's numbers&hellip;</p>
  </header>

  <div class="estate" id="estate"></div>
  <div id="specialWrap"></div>
  <div class="cards" id="cards"></div>
  <footer>
    <span id="updated"></span> &middot;
    <button class="refresh-btn" onclick="load(true)">Refresh</button>
  </footer>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-header">
      <h2 id="sheetTitle">Site</h2>
      <button class="sheet-close" onclick="closeSheet()">&times;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

<script>
const GBP = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', maximumFractionDigits: 0 });
const GBP2 = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP', maximumFractionDigits: 2 });

function sparkline(points) {
  if (!points || points.length < 2) return '';
  const vals = points.map(p => p.revenue);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const w = 300, h = 44, n = points.length;
  const coords = points.map((p, i) => {
    const x = (i / (n - 1)) * w;
    const y = h - ((p.revenue - min) / range) * (h - 6) - 3;
    return [x, y];
  });
  const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const last = coords[coords.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="#d97706" stroke-width="2" vector-effect="non-scaling-stroke" />
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#d97706" />
  </svg>`;
}

function pctDelta(pct) {
  if (pct == null) return '';
  const cls = pct >= 0 ? 'up' : 'down';
  const arrow = pct >= 0 ? '&uarr;' : '&darr;';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}%</span>`;
}

function guestSection(guest) {
  if (!guest) return '';
  const sph = guest.spend_per_head != null ? GBP2.format(guest.spend_per_head) : '&ndash;';
  const sphAvg = guest.spend_per_head_avg7 != null ? `<span class="sub">7d avg ${GBP2.format(guest.spend_per_head_avg7)}</span>` : '';
  const ppc = guest.plates_per_cover != null ? guest.plates_per_cover.toFixed(2) : '&ndash;';
  const ppcAvg = guest.plates_per_cover_avg7 != null ? `<span class="sub">7d avg ${guest.plates_per_cover_avg7.toFixed(2)}</span>` : '';
  return `
    <div class="section">
      <div class="section-label">Guest metrics</div>
      <div class="row2">
        <div class="mini"><div class="label">Spend / head</div><div class="value">${sph}${sphAvg}</div></div>
        <div class="mini"><div class="label">Plates / cover</div><div class="value">${ppc}${ppcAvg}</div></div>
      </div>
    </div>`;
}

function deliverySection(d) {
  if (!d) return '';
  return `
    <div class="section">
      <div class="section-label">Delivery &amp; takeaway &middot; last 7 days &middot; ${GBP.format(d.total)}</div>
      <div class="chips">
        <span class="chip">Uber Eats <b>${GBP.format(d.uber_eats)}</b></span>
        <span class="chip">Just Eat <b>${GBP.format(d.just_eat)}</b></span>
        <span class="chip">Deliveroo <b>${GBP.format(d.deliveroo)}</b></span>
        <span class="chip">Online <b>${GBP.format(d.online_orders)}</b></span>
      </div>
    </div>`;
}

function starStr(rating) {
  if (rating == null) return '&ndash;';
  return `<span class="stars">${rating.toFixed(1)}&#9733;</span>`;
}

function reviewsSection(r) {
  if (!r) return '';
  const ln = r.last_night;
  const wk = r.avg_7d;
  const lnHtml = ln
    ? `${starStr(ln.rating)} <span style="color:var(--muted)">(${ln.reviews} review${ln.reviews === 1 ? '' : 's'}${ln.nps != null ? ', NPS ' + Math.round(ln.nps) : ''})</span>`
    : '<span style="color:var(--muted)">No reviews last night</span>';
  const wkHtml = wk
    ? `${starStr(wk.rating)} <span style="color:var(--muted)">(${wk.reviews} review${wk.reviews === 1 ? '' : 's'}, NPS ${Math.round(wk.nps)})</span>`
    : '<span style="color:var(--muted)">&ndash;</span>';
  const negHtml = (r.negative_recent || []).map(n => `
    <div class="neg-alert">
      <div class="neg-head"><span>${starStr(n.rating)} &middot; ${n.source}</span><span>${new Date(n.date).toLocaleDateString('en-GB', {day:'numeric', month:'short'})}</span></div>
      <div class="neg-text">${n.snippet ? n.snippet.replace(/</g, '&lt;') : '(no text)'}${n.snippet && n.snippet.length >= 160 ? '&hellip;' : ''}</div>
    </div>`).join('');
  return `
    <div class="section">
      <div class="section-label">Reviews</div>
      <div class="review-row"><span class="name">Last night</span><span>${lnHtml}</span></div>
      <div class="review-row"><span class="name">7-day</span><span>${wkHtml}</span></div>
      ${negHtml}
    </div>`;
}

function periodSection(wtd, mtd) {
  return `
    <div class="section">
      <div class="section-label">This period</div>
      <div class="period-line"><span class="name">Week to date</span><span>${GBP.format(wtd.total)} ${pctDelta(wtd.pct_vs_prior)}</span></div>
      <div class="period-line"><span class="name">Month to date</span><span>${GBP.format(mtd.total)} ${pctDelta(mtd.pct_vs_prior)}</span></div>
    </div>`;
}

function siteCard(site) {
  const ln = site.last_night;
  let deltaHtml = '';
  if (ln && site.avg_7d) {
    const pct = ((ln.revenue - site.avg_7d) / site.avg_7d) * 100;
    deltaHtml = `${pctDelta(pct)} <span style="color:var(--muted);font-size:11px">vs 7d avg</span>`;
  }
  const metrics = ln ? `
    <div class="metrics">
      <div class="metric"><div class="label">Revenue</div><div class="value">${GBP.format(ln.revenue)}</div><div class="delta">${deltaHtml}</div></div>
      <div class="metric"><div class="label">Covers</div><div class="value">${ln.covers}</div></div>
      <div class="metric"><div class="label">Spend/head</div><div class="value">${ln.apc != null ? GBP2.format(ln.apc) : '&ndash;'}</div></div>
    </div>` : '<div class="empty">No trading data yet</div>';

  return `
    <div class="card" onclick="openSheet(${site.id}, '${site.name}')">
      <div class="card-top">
        <h2>${site.name}</h2>
        <span class="date">${ln ? new Date(ln.date).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}) : ''}</span>
      </div>
      ${metrics}
      <div class="spark">${sparkline(site.trend)}</div>
      ${guestSection(site.guest)}
      ${reviewsSection(site.reviews)}
      ${deliverySection(site.delivery_7d)}
      ${periodSection(site.wtd, site.mtd)}
    </div>`;
}

function specialCard(special) {
  if (!special) return '';
  const chips = special.sites.map(s => `<span class="chip">${s.name} <b>${s.qty}</b> ${GBP.format(s.revenue)}</span>`).join('');
  return `
    <div class="special-card">
      <div class="card-top">
        <h2>This month's special</h2>
        <span class="date">${special.name}</span>
      </div>
      <div class="metrics" style="grid-template-columns: 1fr 1fr;">
        <div class="metric"><div class="label">Units sold</div><div class="value">${special.total_qty}</div></div>
        <div class="metric"><div class="label">Revenue</div><div class="value">${GBP.format(special.total_revenue)}</div></div>
      </div>
      <div class="chips">${chips}</div>
    </div>`;
}

function estateSummary(data) {
  const total = data.sites.reduce((s, x) => s + (x.last_night ? x.last_night.revenue : 0), 0);
  const avgTotal = data.sites.reduce((s, x) => s + (x.avg_7d || 0), 0);
  const covers = data.sites.reduce((s, x) => s + (x.last_night ? x.last_night.covers : 0), 0);
  const pct = avgTotal ? ((total - avgTotal) / avgTotal) * 100 : 0;
  const wtd = data.estate.wtd, mtd = data.estate.mtd;
  document.getElementById('estate').innerHTML = `
    <div class="stat"><div class="label">Estate last night</div><div class="value">${GBP.format(total)}</div></div>
    <div class="stat"><div class="label">Covers</div><div class="value">${covers}</div></div>
    <div class="stat"><div class="label">vs 7d avg</div><div class="value" style="color:${pct>=0?'#34d399':'#f87171'}">${pct>=0?'+':''}${pct.toFixed(0)}%</div></div>
    <div class="stat"><div class="label">Week to date</div><div class="value">${GBP.format(wtd.total)}</div><div class="sub">${pctDelta(wtd.pct_vs_prior)} vs last wk</div></div>
    <div class="stat"><div class="label">Month to date</div><div class="value">${GBP.format(mtd.total)}</div><div class="sub">${pctDelta(mtd.pct_vs_prior)} vs last mth</div></div>
  `;
}

async function load(force) {
  document.getElementById('asof').textContent = 'Refreshing…';
  try {
    const res = await fetch('/api/data' + (force ? ('?_=' + Date.now()) : ''));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch (e) {
    document.getElementById('asof').textContent = 'Could not refresh — showing last known numbers.';
  }
}

function render(data) {
  estateSummary(data);
  document.getElementById('specialWrap').innerHTML = specialCard(data.special);
  document.getElementById('cards').innerHTML = data.sites.map(siteCard).join('');
  const latest = data.sites.map(s => s.last_night && s.last_night.date).filter(Boolean).sort().pop();
  document.getElementById('asof').textContent = latest ? `Last night's trading: ${new Date(latest).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'})}` : 'No data yet';
  document.getElementById('updated').textContent = 'Updated ' + new Date(data.generated_at * 1000).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

// --- drill-down sheet ------------------------------------------------
let sheetSiteId = null;
let sheetRange = 7; // number of days, or 'custom'

function openSheet(siteId, name) {
  sheetSiteId = siteId;
  sheetRange = 7;
  document.getElementById('sheetTitle').textContent = name;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  loadDetail();
}

function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow = '';
}

function detailChart(days) {
  const vals = days.map(d => d.revenue);
  if (!vals.length) return '';
  const min = Math.min(...vals, 0), max = Math.max(...vals) || 1;
  const range = (max - min) || 1;
  const w = 320, h = 90, n = days.length, barW = Math.max(w / n - 3, 2);
  const bars = days.map((d, i) => {
    const x = (i / n) * w;
    const barH = ((d.revenue - min) / range) * (h - 8);
    return `<rect x="${x.toFixed(1)}" y="${(h - barH).toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="#d97706" rx="1.5" />`;
  }).join('');
  return `<div class="detail-chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg></div>`;
}

function detailTable(days) {
  if (!days.length) return '<div class="detail-empty">No trading data in this range</div>';
  const rows = days.slice().reverse().map(d => {
    const dt = new Date(d.date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return `<tr>
      <td>${dt}</td>
      <td>${GBP.format(d.revenue)}</td>
      <td>${d.covers || '&ndash;'}</td>
      <td>${d.spend_per_head != null ? GBP2.format(d.spend_per_head) : '&ndash;'}</td>
      <td>${d.plates_per_cover != null ? d.plates_per_cover.toFixed(2) : '&ndash;'}</td>
      <td>${d.delivery_total ? GBP.format(d.delivery_total) : '&ndash;'}</td>
    </tr>`;
  }).join('');
  return `<table class="detail-table">
    <thead><tr><th>Date</th><th>Revenue</th><th>Covers</th><th>Spend/hd</th><th>Plates/cvr</th><th>Delivery</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function chipsHtml() {
  const presets = [7, 30, 90];
  const chips = presets.map(n => `<button class="range-chip ${sheetRange === n ? 'active' : ''}" onclick="setRange(${n})">${n}d</button>`).join('');
  const customActive = sheetRange === 'custom';
  return `<div class="range-chips">${chips}<button class="range-chip ${customActive ? 'active' : ''}" onclick="setRange('custom')">Custom</button></div>` +
    (customActive ? `
      <div class="custom-range">
        <input type="date" id="customFrom" />
        <span style="color:var(--muted)">&ndash;</span>
        <input type="date" id="customTo" />
        <button onclick="loadDetail()">Go</button>
      </div>` : '');
}

function setRange(n) {
  sheetRange = n;
  loadDetail();
}

async function loadDetail() {
  const body = document.getElementById('sheetBody');
  body.innerHTML = chipsHtml() + '<div class="detail-loading">Loading&hellip;</div>';
  let url = `/api/site/${sheetSiteId}?`;
  if (sheetRange === 'custom') {
    const fromEl = document.getElementById('customFrom');
    const toEl = document.getElementById('customTo');
    if (fromEl && toEl && fromEl.value && toEl.value) {
      url += `from=${fromEl.value}&to=${toEl.value}`;
    } else {
      body.innerHTML = chipsHtml();
      return; // wait for the user to pick both dates
    }
  } else {
    url += `range=${sheetRange}`;
  }
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderDetail(data);
  } catch (e) {
    body.innerHTML = chipsHtml() + '<div class="detail-empty">Could not load this range.</div>';
  }
}

function renderDetail(data) {
  const t = data.totals;
  const totalsHtml = `
    <div class="detail-totals">
      <div class="mini"><div class="label">Revenue</div><div class="value">${GBP.format(t.revenue)}</div></div>
      <div class="mini"><div class="label">Covers</div><div class="value">${t.covers}</div></div>
      <div class="mini"><div class="label">Spend/head</div><div class="value">${t.spend_per_head_avg != null ? GBP2.format(t.spend_per_head_avg) : '&ndash;'}</div></div>
    </div>`;
  document.getElementById('sheetBody').innerHTML =
    chipsHtml() + totalsHtml + detailChart(data.days) + detailTable(data.days);
}

load(false);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
